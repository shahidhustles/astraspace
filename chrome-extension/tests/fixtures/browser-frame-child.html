<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame child fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 8px;
        position: relative;
      }
      p {
        margin: 0 0 6px;
        font-size: 12px;
      }
      #grandchild-frame {
        border: 0;
        margin-top: 6px;
      }
      #child-removable,
      #child-next {
        position: absolute;
        right: 8px;
      }
      #child-removable {
        top: 8px;
      }
      #child-next {
        top: 32px;
      }
    </style>
  </head>
  <body>
    <p>Child frame content.</p>
    <p>Frame marker text</p>
    <p>Frame marker text</p>
    <button id="child-action" type="button">Sibling action</button>
    <input id="child-input" aria-label="Child text input" value="" />
    <select id="child-select" aria-label="Child select">
      <option value="child-one" selected>Child One</option>
      <option value="child-two">Child Two</option>
      <option value="child-disabled" disabled>Child Disabled</option>
    </select>
    <div id="child-removable" role="status" aria-label="Frame status">Frame status</div>
    <a id="child-next" href="?v=2" type="button">Next child version</a>
    <div id="child-nested"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const cross = params.get("role") === "cross";
      document.getElementById("child-action").textContent = cross
        ? "Cross-origin action"
        : "Same-origin action";
      document.getElementById("child-input").setAttribute(
        "aria-label",
        cross ? "Cross-origin text input" : "Child text input",
      );
      document.getElementById("child-select").setAttribute(
        "aria-label",
        cross ? "Cross-origin select" : "Child select",
      );
      document.body.dataset.version = params.get("v") || "1";
      if (!cross) {
        const frame = document.createElement("iframe");
        frame.id = "grandchild-frame";
        frame.src = "browser-frame-grandchild.html";
        frame.width = "340";
        frame.height = "90";
        document.getElementById("child-nested").appendChild(frame);
      }
    </script>
  </body>
</html>
