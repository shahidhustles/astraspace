<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Observation fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 16px;
      }
      .spacer {
        height: 1500px;
      }
    </style>
  </head>
  <body>
    <h1>Observation fixture</h1>
    <p>TOP VISIBLE TEXT for the first observation.</p>

    <form id="login">
      <label for="email">Email</label>
      <input id="email" type="email" name="email" />
      <label for="password">Password</label>
      <input id="password" type="password" name="password" value="hunter2secret" />
      <button id="submit" type="submit">Submit</button>
      <button id="disabled-button" type="button" disabled>Disabled</button>
      <input type="hidden" name="token" value="hidden-secret" />
    </form>

    <a id="nested-link" href="#"><button id="nested-button" type="button">Nested click</button></a>

    <button id="hidden-button" type="button" style="display: none">Hidden button</button>
    <div id="hidden-div" hidden>Hidden block</div>

    <div class="spacer"></div>

    <section id="bottom">
      <h2>Bottom section</h2>
      <p>BOTTOM VISIBLE TEXT after scrolling.</p>
      <button id="bottom-button" type="button">Bottom action</button>
      <a id="bottom-link" href="#">Bottom link</a>
    </section>
  </body>
</html>
