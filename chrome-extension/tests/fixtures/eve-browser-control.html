<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Eve browser control loop fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        font-size: 14px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      input,
      select {
        width: 240px;
        padding: 4px;
      }
      button {
        margin-top: 16px;
        padding: 6px 12px;
      }
      #success-row {
        margin-top: 16px;
        padding: 8px;
        background: #e8f5e9;
        border: 1px solid #81c784;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Eve browser control loop</h1>
    <p id="intro">Deterministic local fixture for the complete Eve browser loop.</p>

    <label for="name-input">Name</label>
    <input id="name-input" aria-label="Name" autocomplete="off" />

    <label for="city-input">City</label>
    <input id="city-input" aria-label="City" autocomplete="off" />

    <label for="country-select">Country</label>
    <select id="country-select" aria-label="Country">
      <option value="none" selected>Pick one</option>
      <option value="greenland">Greenland</option>
      <option value="kenya">Kenya</option>
    </select>

    <div>
      <button id="submit-form" type="button" aria-label="Submit form" disabled>Submit form</button>
    </div>
    <div id="success-row" role="status" aria-label="Form success"></div>
    <div id="rerender-row"></div>

    <script>
      var nameInput = document.getElementById("name-input");
      var cityInput = document.getElementById("city-input");
      var countrySelect = document.getElementById("country-select");
      var submit = document.getElementById("submit-form");
      var success = document.getElementById("success-row");

      function formValid() {
        return (
          nameInput.value.trim() !== "" &&
          cityInput.value.trim() !== "" &&
          countrySelect.value !== "none"
        );
      }

      function refreshSubmit() {
        submit.disabled = !formValid();
      }

      nameInput.addEventListener("input", refreshSubmit);
      cityInput.addEventListener("input", refreshSubmit);
      countrySelect.addEventListener("change", refreshSubmit);

      submit.addEventListener("click", function () {
        // Delayed completion: the measured post-action wait must observe the
        // success row without any fixed test sleep.
        setTimeout(function () {
          var value =
            "Submitted by " +
            nameInput.value.trim() +
            " from " +
            cityInput.value.trim() +
            ", " +
            countrySelect.value + ".";
          success.textContent = value;
          success.setAttribute("aria-label", "Form success");
          // Rerender mode: replace the submit button with a fresh DOM node so
          // the previous ref becomes stale.
          if (new URLSearchParams(location.search).get("mode") === "rerender") {
            var fresh = document.createElement("button");
            fresh.type = "button";
            fresh.setAttribute("aria-label", "Submit form");
            fresh.textContent = "Submit form";
            fresh.disabled = !formValid();
            fresh.addEventListener("click", function () {
              setTimeout(function () {
                success.textContent = "Submitted again";
              }, 500);
            });
            submit.replaceWith(fresh);
            submit = fresh;
          }
        }, 1500);
      });

      refreshSubmit();
    </script>
  </body>
</html>
