<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Frame observation fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        gap: 12px;
        margin: 10px 0;
      }
      iframe {
        border: 0;
      }
      .section {
        margin: 10px 0;
      }
      .scroll-spacer {
        height: 1400px;
      }
      .scroll-container {
        width: 320px;
        height: 140px;
        overflow-y: auto;
        border: 1px solid #999;
        margin: 10px 0;
      }
      #container-action {
        position: sticky;
        top: 0;
      }
    </style>
  </head>
  <body>
    <h1>Frame observation fixture</h1>
    <button id="main-action" type="button">Main action</button>

    <div id="shadow-host" class="section"></div>
    <div id="closed-host" class="section"></div>

    <div id="rerender-area" class="section">
      <button id="rerender-button" type="button">Rerender action</button>
    </div>

    <div id="interaction-area" class="section">
      <button id="count-button" type="button">Count action</button>
      <button id="disabled-button" type="button" disabled>Disabled action</button>
      <input id="file-input" type="file" />
      <a id="new-tab-link" href="browser-frame-child.html?role=newtab" target="_blank">New tab action</a>
    </div>

    <div id="input-area" class="section">
      <input id="text-input" aria-label="Text input" value="existing" />
      <textarea id="text-area" aria-label="Text area">existing</textarea>
      <div id="editable-div" aria-label="Editable div" contenteditable="true">existing</div>
      <input id="readonly-input" aria-label="Read-only input" value="locked" readonly />
      <input id="disabled-input" aria-label="Disabled input" value="" />
      <div id="plain-div" aria-label="Plain div" tabindex="0">Not editable</div>
      <div id="event-input-row">
        <input id="event-input" aria-label="Event input" value="" />
        <span id="event-log"></span>
      </div>
      <div id="key-log"></div>
    </div>

    <div id="select-area" class="section">
      <select id="main-select" aria-label="Main select">
        <option value="alpha" selected>Alpha</option>
        <option value="beta">Beta</option>
        <option value="gamma" disabled>Gamma</option>
        <option value="duplicate">Duplicate</option>
        <option value="duplicate">Duplicate</option>
      </select>
      <span id="select-event-log"></span>
    </div>

    <div class="row">
      <iframe
        id="same-origin-frame"
        src="browser-frame-child.html?role=same"
        width="380"
        height="170"
      ></iframe>
      <iframe id="cross-origin-frame" src="{{CROSS_ORIGIN_URL}}" width="380" height="170"></iframe>
    </div>

    <div id="scroll-document" class="section">
      <h2>Scroll document section</h2>
      <p>Scroll marker text</p>
      <p>Scroll marker text</p>
      <p>Scroll marker text</p>
      <p>It&rsquo;s &ldquo;quoted&rdquo; with [data-x=&quot;y&quot;] syntax.</p>
      <p id="split-marker">Split <strong>marker</strong> phrase</p>
      <p style="opacity: 0">Invisible opacity marker</p>
      <p style="visibility: hidden">Invisible visibility marker</p>
    </div>

    <div id="scroll-container" class="scroll-container">
      <p>Container marker text</p>
      <button id="container-action" type="button">Container action</button>
      <div class="scroll-spacer"></div>
    </div>

    <div class="scroll-spacer"></div>

    <script>
      const shadowHost = document.getElementById("shadow-host");
      const shadow = shadowHost.attachShadow({ mode: "open" });
      const shadowButton = document.createElement("button");
      shadowButton.type = "button";
      shadowButton.textContent = "Shadow action";
      shadow.appendChild(shadowButton);
      const shadowInput = document.createElement("input");
      shadowInput.type = "text";
      shadowInput.setAttribute("aria-label", "Shadow text input");
      shadow.appendChild(shadowInput);
      const shadowSelect = document.createElement("select");
      shadowSelect.setAttribute("aria-label", "Shadow select");
      for (const [value, text] of [
        ["shadow-one", "Shadow One"],
        ["shadow-two", "Shadow Two"],
      ]) {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = text;
        if (value === "shadow-one") {
          option.selected = true;
        }
        shadowSelect.appendChild(option);
      }
      shadow.appendChild(shadowSelect);
      const innerHost = document.createElement("div");
      shadow.appendChild(innerHost);
      const innerShadow = innerHost.attachShadow({ mode: "open" });
      const innerButton = document.createElement("button");
      innerButton.type = "button";
      innerButton.textContent = "Nested shadow action";
      innerShadow.appendChild(innerButton);

      const shadowMarker = document.createElement("p");
      shadowMarker.textContent = "Shadow marker text";
      shadow.appendChild(shadowMarker);
      shadow.appendChild(document.createTextNode("Direct shadow marker text"));

      const closedHost = document.getElementById("closed-host");
      const closed = closedHost.attachShadow({ mode: "closed" });
      const closedButton = document.createElement("button");
      closedButton.type = "button";
      closedButton.textContent = "Closed shadow action";
      closed.appendChild(closedButton);

      window.__rerender = (mode) => {
        const area = document.getElementById("rerender-area");
        if (mode === "different") {
          area.innerHTML = '<button id="rerender-button" type="button">Different action</button>';
          return;
        }
        if (mode === "duplicate") {
          area.innerHTML =
            '<button type="button">Rerender action</button>' +
            '<button type="button">Rerender action</button>';
          return;
        }
        area.innerHTML = '<button id="rerender-button" type="button">Rerender action</button>';
      };

      window.__rerenderShadow = (mode) => {
        if (mode === "duplicate") {
          shadow.innerHTML =
            '<button type="button">Shadow action</button>' +
            '<button type="button">Shadow action</button>';
          return;
        }
        shadow.innerHTML = '<div><button id="moved-shadow-action" type="button">Shadow action</button></div>';
      };

      window.__rerenderSelect = () => {
        const select = document.getElementById("main-select");
        select.innerHTML =
          '<option value="alpha" selected>Alpha</option>' +
          '<option value="replacement">Replacement</option>';
      };

      const countButton = document.getElementById("count-button");
      countButton.addEventListener("click", () => {
        countButton.textContent =
          "Count action " + (Number(countButton.dataset.count ?? 0) + 1);
        countButton.dataset.count = String(Number(countButton.dataset.count ?? 0) + 1);
      });

      shadowButton.addEventListener("click", () => {
        shadowButton.textContent =
          "Shadow action " + (Number(shadowButton.dataset.count ?? 0) + 1);
        shadowButton.dataset.count = String(Number(shadowButton.dataset.count ?? 0) + 1);
      });

      const eventInput = document.getElementById("event-input");
      const eventLog = document.getElementById("event-log");
      for (const type of ["input", "change"]) {
        eventInput.addEventListener(type, () => {
          eventLog.textContent = eventLog.textContent + " " + type + ":" + eventInput.value;
        });
      }

      const mainSelect = document.getElementById("main-select");
      const selectEventLog = document.getElementById("select-event-log");
      for (const type of ["input", "change"]) {
        mainSelect.addEventListener(type, () => {
          selectEventLog.textContent = selectEventLog.textContent + " " + type + ":" + mainSelect.value;
        });
      }

      const keyLog = document.getElementById("key-log");
      document.addEventListener("keydown", (event) => {
        const parts = [];
        if (event.ctrlKey) parts.push("ctrl");
        if (event.altKey) parts.push("alt");
        if (event.metaKey) parts.push("meta");
        if (event.shiftKey) parts.push("shift");
        parts.push(event.key);
        keyLog.textContent = parts.join("+");
      });
    </script>
  </body>
</html>
