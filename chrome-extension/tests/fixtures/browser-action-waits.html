<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Browser action waits fixture</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 12px;
        font-size: 14px;
      }
      label {
        display: block;
        margin: 12px 0 4px;
      }
      input,
      select {
        width: 240px;
        padding: 4px;
      }
      #log {
        margin-top: 16px;
        padding: 8px;
        background: #f4f4f4;
        min-height: 40px;
        white-space: pre-line;
      }
      #doc-spacer {
        height: 1800px;
      }
      #scroll-box {
        height: 240px;
        overflow-y: auto;
        border: 1px solid #ccc;
      }
      .row {
        padding: 6px 10px;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <h1>Waits fixture</h1>
    <label for="suggest-input">Suggest input</label>
    <input id="suggest-input" aria-label="Suggest input" autocomplete="off" />
    <ul id="suggest-list"></ul>

    <label for="fail-input">Fail input</label>
    <input id="fail-input" aria-label="Fail input" autocomplete="off" />

    <label for="ws-input">Ws input</label>
    <input id="ws-input" aria-label="Ws input" autocomplete="off" />

    <label for="chip-select">Chip select</label>
    <select id="chip-select" aria-label="Chip select">
      <option value="none" selected>Pick chips</option>
      <option value="green">Green chip</option>
      <option value="red">Red chip</option>
    </select>
    <div id="chips"></div>

    <h2>Navigation</h2>
    <button id="push-route" type="button">Push route</button>
    <button id="deferred-nav" type="button">Deferred nav</button>
    <button id="spawn-iframe" type="button">Spawn frame</button>
    <div id="iframe-host"></div>
    <div id="nav-log"></div>

    <h2>Clicks</h2>
    <button id="idle-click" type="button">Idle click</button>
    <button id="dom-click" type="button">Dom click</button>
    <ul id="dom-list"></ul>
    <button id="nav-click" type="button">Nav click</button>
    <button id="route-click" type="button">Route click</button>
    <button id="open-popup" type="button">Open popup</button>
    <button id="toast-click" type="button">Toast click</button>
    <button id="end-import" type="button">End import</button>
    <div id="import-pill" role="status">Import running</div>
    <div id="toast-host"></div>
    <iframe id="expect-frame" src="/child.html"></iframe>

    <h2>Scroller</h2>
    <div id="scroll-box" aria-label="Scroll box">
      <div class="row"><button id="box-anchor" type="button" aria-label="Box anchor">Box anchor</button></div>
    </div>
    <div id="doc-spacer"></div>

    <div id="log"></div>

    <script>
      function frameDoc() {
        var frame = document.getElementById("expect-frame");
        return frame && frame.contentWindow ? frame.contentWindow.document : null;
      }
      function armToast(after, host) {
        setTimeout(function () {
          var marker = document.createElement("div");
          marker.setAttribute("role", "dialog");
          marker.setAttribute("aria-label", "Import ready");
          host.appendChild(marker);
        }, after);
      }

      document.getElementById("idle-click").addEventListener("click", function () {});
      document.getElementById("dom-click").addEventListener("click", function () {
        var item = document.createElement("li");
        item.textContent = "appended";
        document.getElementById("dom-list").appendChild(item);
      });
      document.getElementById("nav-click").addEventListener("click", function () {
        // Synchronous assignment keeps the document request inside every
        // settle window instead of racing stability completion.
        location.assign("?step=clicked");
      });
      document.getElementById("route-click").addEventListener("click", function () {
        history.pushState({ route: "#clicked" }, "", "#clicked");
        navLog("route-clicked");
      });

      // Expectation drivers stay inert until a test calls them.
      window.__appearMain = function () { armToast(200, document.getElementById("toast-host")); };
      window.__appearAmbiguous = function () {
        setTimeout(function () {
          var host = document.getElementById("toast-host");
          for (var i = 0; i < 2; i++) { armToast(50, host); }
        }, 10);
      };
      window.__appearInFrame = function () {
        var doc = frameDoc();
        if (!doc || !doc.body) return;
        armToast(200, doc.body);
      };
      window.__disappearFromFrame = function () {
        var doc = frameDoc();
        if (!doc) return;
        var probe = doc.getElementById("child-removable");
        if (probe && probe.parentNode) { setTimeout(function () { probe.remove(); }, 150); }
      };

      var timers = {};
      function debounce(key, fn, wait) {
        clearTimeout(timers[key]);
        timers[key] = setTimeout(fn, wait);
      }
      function log(entry) {
        var line = document.createElement("div");
        line.textContent = entry;
        document.getElementById("log").appendChild(line);
      }

      var suggest = document.getElementById("suggest-input");
      suggest.addEventListener("input", function () {
        var q = suggest.value.trim();
        if (!q) return;
        debounce("suggest", function () {
          fetch("/respond?kind=suggest&q=" + encodeURIComponent(q))
            .then(function (response) { return response.json(); })
            .then(function (items) {
              var list = document.getElementById("suggest-list");
              list.innerHTML = "";
              items.forEach(function (label) {
                var item = document.createElement("li");
                item.textContent = label;
                list.appendChild(item);
              });
              log("rendered:" + items.length);
            });
        }, 100);
      });

      document.getElementById("fail-input").addEventListener("input", function () {
        var controller = new AbortController();
        fetch("/respond?kind=suggest&q=fail", { signal: controller.signal })
          .then(function () { log("unexpected-success"); })
          .catch(function () { log("fetch-failed"); });
        setTimeout(function () { controller.abort(); }, 50);
      });

      var wsOpened = false;
      window.__wsReadyState = 0;
      document.getElementById("ws-input").addEventListener("input", function () {
        var probe = new Image();
        probe.src = "/pixel.png";
        if (wsOpened) return;
        wsOpened = true;
        var protocol = location.protocol === "https:" ? "wss:" : "ws:";
        var socket = new WebSocket(protocol + "//" + location.host + "/ws");
        window.__wsSocket = socket;
        socket.onopen = function () {
          window.__wsReadyState = socket.readyState;
          log("ws-open");
        };
        socket.onclose = function () {
          window.__wsReadyState = socket.readyState;
        };
      });

      document.getElementById("chip-select").addEventListener("change", function (event) {
        var choice = event.target.value;
        if (choice === "none") return;
        debounce("chips", function () {
          var host = document.getElementById("chips");
          ["left", choice].forEach(function (name) {
            var chip = document.createElement("span");
            chip.textContent = name + "-chip";
            host.appendChild(chip);
          });
          log("chips-rendered:" + choice);
        }, 200);
      });

      // Navigation hooks. Everything below stays inert unless a test drives
      // it, so edit-settling scenarios never see this machinery.
      function navLog(entry) {
        var line = document.createElement("div");
        line.textContent = entry;
        document.getElementById("nav-log").appendChild(line);
      }

      window.__setChildSrc = function (src) {
        navLog("child-src-armed");
        var frame = document.createElement("iframe");
        frame.id = "child-frame";
        frame.src = src;
        document.getElementById("iframe-host").appendChild(frame);
      };

      window.__swapChildSrc = function (src) {
        navLog("child-swap");
        var frame = document.querySelector("#iframe-host iframe");
        if (!frame) return;
        frame.contentWindow.location.replace(src);
      };

      window.__pushRoute = function () {
        history.pushState({ route: "#route" }, "", "#route");
        navLog("route-pushed");
      };

      window.__deferredNavigate = function () {
        setTimeout(function () { location.assign("?step=2"); }, 150);
      };

      var params = new URLSearchParams(location.search);
      var childParam = params.get("child");
      if (childParam) {
        var bootFrame = document.createElement("iframe");
        bootFrame.id = "child-frame";
        bootFrame.src = decodeURIComponent(childParam);
        document.getElementById("iframe-host").appendChild(bootFrame);
      }

      document.getElementById("push-route").addEventListener("click", function () { window.__pushRoute(); });
      document.getElementById("deferred-nav").addEventListener("click", function () { window.__deferredNavigate(); });
      document.getElementById("spawn-iframe").addEventListener("click", function () {
        window.__setChildSrc("/child.html");
      });

      document.getElementById("open-popup").addEventListener("click", function () {
        window.open("/child.html?popped=1", "astra-popup", "width=420,height=320");
      });
      document.getElementById("toast-click").addEventListener("click", function () {
        armToast(250, document.getElementById("toast-host"));
      });
      document.getElementById("end-import").addEventListener("click", function () {
        setTimeout(function () {
          var pill = document.getElementById("import-pill");
          if (pill && pill.parentNode) { pill.parentNode.removeChild(pill); }
        }, 150);
      });

      // Scroll scenarios stay inert until a test scrolls the box: the lazy
      // loader only fires once its sentinel nears the container bottom.
      var ROW_HEIGHT = 30;
      var INITIAL_ROWS = 80;
      var MAX_ROWS = 160;
      var MARKERS = { 60: "Deep scroll marker one", 68: "Deep scroll marker two", 76: "Deep scroll marker three" };
      var rowBudget = INITIAL_ROWS;

      function appendRows(host, count) {
        for (var i = 0; i < count && rowBudget < MAX_ROWS; i++) {
          var row = document.createElement("div");
          row.className = "row";
          var marker = MARKERS[rowBudget % 80];
          row.textContent = marker ? marker : "Row " + rowBudget + " filler";
          row.setAttribute("data-created", String(Date.now()));
          host.appendChild(row);
          rowBudget++;
        }
        return i;
      }

      window.__lastLazyInsertAt = 0;
      var box = document.getElementById("scroll-box");
      var initialCount = appendRows(box, INITIAL_ROWS);
      var sentinel = document.createElement("div");
      sentinel.id = "lazy-sentinel";
      box.appendChild(sentinel);

      var observer = new IntersectionObserver(function (entries) {
        if (!entries.some(function (entry) { return entry.isIntersecting; })) {
          return;
        }
        setTimeout(function () {
          if (rowBudget >= MAX_ROWS) {
            return;
          }
          window.__lastLazyInsertAt = Date.now();
          appendRows(box, 20);
        }, 150);
      }, { root: box, rootMargin: "80px" });

      observer.observe(sentinel);

      // Test drivers. Fresh navigations reset whatever these leave behind.
      // Arming before a scroll makes the container vanish on the first
      // scroll event, so settlement probes run into a removed surface.
      window.__removeScrollBox = function () {
        var box = document.getElementById("scroll-box");
        if (!box || box.__removeArmed) { return; }
        box.__removeArmed = true;
        box.addEventListener("scroll", function () {
          requestAnimationFrame(function () {
            var target = document.getElementById("scroll-box");
            if (target) { target.remove(); }
          });
        }, { once: true });
      };

      window.__lockScrollTo = function (top) {
        window.__releaseScrollLock();
        window.__lockTimer = setInterval(function () {
          var box = document.getElementById("scroll-box");
          if (box) { box.scrollTop = top; }
        }, 120);
      };

      window.__releaseScrollLock = function () {
        if (window.__lockTimer) { clearInterval(window.__lockTimer); window.__lockTimer = null; }
      };

      // Fires a lazy burst shortly after the scroll barrier starts sampling,
      // so tests can assert the quiet window covered the insertion.
      window.__queueLazyBurst = function () {
        setTimeout(function () {
          var box = document.getElementById("scroll-box");
          if (!box || rowBudget >= MAX_ROWS) { return; }
          window.__lastLazyInsertAt = Date.now();
          appendRows(box, 20);
        }, 60);
      };
    </script>
  </body>
</html>
